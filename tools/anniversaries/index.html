<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纪念日 · blackblues</title><link rel="stylesheet" href="../../assets/css/account.css"><script src="../../script.js" defer></script><script type="module" src="app.mjs"></script></head><body><main class="app-shell"><nav class="app-nav"><a class="wordmark" href="../../">BLACKBLUES.</a><a href="../../account/">账户中心 ↗</a></nav><p class="eyebrow">DAYS THAT MATTER</p><h1>记住那些重要的日子。</h1><p class="lead">用公历记录纪念日，在不同设备上读取自己的记录。</p><p id="status" class="app-status" role="status" aria-live="polite"></p>
<section id="intro" class="app-card"><h2>把重要的日子留给自己</h2><p>登录后可以创建、保存和同步私人纪念日。内测采用邀请制，未登录时不会读取私人数据。</p><a class="app-link" href="../../account/">前往登录 →</a></section>
<section id="workspace" hidden><p id="accountLabel" class="muted"></p><section class="app-card"><p id="featuredTitle" class="muted">尚无纪念日</p><div id="featuredDays" class="countdown">—</div><p id="featuredDetail" class="muted"></p></section><div class="app-grid"><section class="app-card"><div class="app-actions"><h2>你的纪念日</h2><button id="refresh" type="button">刷新</button><button id="new" type="button" class="primary">添加</button></div><ul id="list" class="app-list"></ul></section><form id="editor" class="app-card"><fieldset id="fields"><h2 id="editorTitle">新建纪念日</h2><label>名称<input id="title" maxlength="200" required></label><label>原始日期<input id="eventDate" type="date" min="0001-01-01" max="9999-12-31" required></label><label><input id="repeat" type="checkbox"> 每年重复</label><label>备注<textarea id="notes" maxlength="20000"></textarea></label><p class="muted">按本机当地日期计算；2月29日在非闰年按2月28日纪念。</p><div class="app-actions"><button id="save" class="primary" type="submit">保存到云端</button><button id="delete" type="button" hidden>删除记录</button><button id="draftExport" type="button">导出本页草稿</button></div><div id="conflictActions" class="app-actions" hidden><button id="copyAsNew" type="button">另存为新记录</button><button id="reloadCloud" type="button">确认后载入云端版本</button></div></fieldset></form></div></section><footer>BLACKBLUES / 私人纪念日 · 每台设备需要独立登录</footer></main></body></html>
