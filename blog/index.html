<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="blackblues 的文章归档。">
    <title>blog | blackblues</title>
    <link rel="stylesheet" href="../assets/css/theme.css">
  </head>
  <body class="blog-list-page">
    <main class="page">
      <nav class="top-nav" aria-label="顶部导航">
        <a class="back-link" href="../index.html">← blackblues</a>
        <button id="theme-btn" class="theme-toggle" type="button" aria-label="切换主题">☀️</button>
      </nav>

      <section aria-labelledby="categories-title">
        <h1 class="section-title" id="categories-title">板块</h1>
        <div id="categoryGrid" class="category-grid" aria-live="polite"></div>
      </section>

      <hr class="divider">

      <section aria-labelledby="latest-title">
        <h2 class="section-title" id="latest-title">最新文章</h2>
        <div id="postList" class="post-list" aria-live="polite"></div>
        <p id="blogEmptyState" class="blog-empty-state" hidden>暂无文章</p>
      </section>
    </main>
    <footer class="site-footer">
      <span>© 2026 blackblues · blackblues.xyz</span>
      <span class="site-footer-links">
        <a href="./index.html">博客</a> ·
        <a href="../music/index.html">音乐</a> ·
        <a href="https://github.com/blackblues360" target="_blank" rel="noopener noreferrer">GitHub</a>
      </span>
    </footer>
    <script src="../script.js"></script>
    <script>
      (() => {
        const postsEndpoint = '../config/posts.json';
        const categoryGrid = document.querySelector('#categoryGrid');
        const postList = document.querySelector('#postList');
        const latestTitle = document.querySelector('#latest-title');
        const emptyState = document.querySelector('#blogEmptyState');
        const colors = ['#74c69d', '#b8875f', '#a78bfa', '#60a5fa', '#c9a96e', '#66d9c4'];
        const preferredCategories = ['思考', '生活', '技术', '音乐', '阅读', '随笔'];
        const categoryDescriptions = {
          思考: '工具、效率和工作方式',
          生活: '生活缝隙里的片段',
          技术: '技术和建站记录',
          音乐: '最近在听的歌',
          阅读: '读书笔记和记录',
          随笔: '杂记、心情和短记录'
        };
        let posts = [];
        let currentCategory = new URLSearchParams(window.location.search).get('category') || '';

        if (!categoryGrid || !postList || !latestTitle || !emptyState) return;

        const formatCount = count => `${count}篇`;
        const categoryColor = category => {
          const categories = sortedCategories();
          const index = categories.findIndex(([name]) => name === category);
          return colors[(Math.max(0, index) + 1) % colors.length];
        };
        const categoryOrder = category => {
          const index = preferredCategories.indexOf(category);
          return index === -1 ? preferredCategories.length : index;
        };
        const sortedCategories = () => {
          const counts = new Map();
          posts.forEach(post => {
            counts.set(post.category, (counts.get(post.category) || 0) + 1);
          });
          return Array.from(counts.entries()).sort(([categoryA], [categoryB]) => {
            const orderA = categoryOrder(categoryA);
            const orderB = categoryOrder(categoryB);
            if (orderA !== orderB) return orderA - orderB;
            return categoryA.localeCompare(categoryB, 'zh-Hans-CN');
          });
        };

        const categoryUrl = category => {
          if (!category) return './index.html';
          return `./index.html?category=${encodeURIComponent(category)}`;
        };

        const createCategoryCard = (category, count, index) => {
          const link = document.createElement('a');
          link.className = 'category-card-link';
          link.href = categoryUrl(category);
          link.style.setProperty('--theme', colors[index % colors.length]);

          const card = document.createElement('span');
          card.className = 'category-card';
          if (category === currentCategory || (!category && !currentCategory)) {
            card.classList.add('is-active');
            link.setAttribute('aria-current', 'page');
          }

          const body = document.createElement('span');
          body.className = 'category-body';

          const name = document.createElement('span');
          name.className = 'category-name';
          name.textContent = category || '全部';

          const desc = document.createElement('span');
          desc.className = 'category-desc';
          desc.textContent = category ? (categoryDescriptions[category] || `${category} 分类文章`) : '全部文章归档';

          const countEl = document.createElement('span');
          countEl.className = 'category-count';
          countEl.textContent = formatCount(count);

          body.append(name, desc);
          card.append(body, countEl);
          link.append(card);
          link.addEventListener('click', event => {
            event.preventDefault();
            currentCategory = category;
            history.pushState(null, '', categoryUrl(category));
            render();
          });

          return link;
        };

        const renderCategories = () => {
          categoryGrid.replaceChildren(createCategoryCard('', posts.length, 0));
          sortedCategories().forEach(([category, count], index) => {
            categoryGrid.append(createCategoryCard(category, count, index + 1));
          });
        };

        const createPostRow = post => {
          const row = document.createElement('a');
          row.className = 'post-row';
          row.href = post.url;
          row.style.setProperty('--theme', categoryColor(post.category));

          const left = document.createElement('span');
          left.className = 'post-left';

          const date = document.createElement('span');
          date.className = 'post-date';
          date.textContent = post.date;

          const tag = document.createElement('span');
          tag.className = 'post-tag';
          tag.textContent = post.category;

          const title = document.createElement('span');
          title.className = 'post-title';
          title.textContent = post.title;

          const excerpt = document.createElement('span');
          excerpt.className = 'post-excerpt';
          excerpt.textContent = post.description;

          left.append(date, tag, title);
          row.append(left, excerpt);
          return row;
        };

        const renderPosts = () => {
          const visiblePosts = currentCategory
            ? posts.filter(post => post.category === currentCategory)
            : posts;

          latestTitle.textContent = currentCategory ? `${currentCategory}文章` : '最新文章';
          postList.replaceChildren(...visiblePosts.map(createPostRow));
          emptyState.hidden = visiblePosts.length > 0;
        };

        const render = () => {
          renderCategories();
          renderPosts();
        };

        window.addEventListener('popstate', () => {
          currentCategory = new URLSearchParams(window.location.search).get('category') || '';
          render();
        });

        fetch(postsEndpoint)
          .then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
          })
          .then(data => {
            posts = Array.isArray(data) ? data : [];
            render();
          })
          .catch(() => {
            categoryGrid.replaceChildren();
            postList.replaceChildren();
            emptyState.textContent = '文章加载失败';
            emptyState.hidden = false;
          });
      })();
    </script>
  </body>
</html>
