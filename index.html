<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>blackblues</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://api.open-meteo.com">
    <link rel="preconnect" href="https://wttr.in">
    <link rel="dns-prefetch" href="//api.open-meteo.com">
    <link rel="dns-prefetch" href="//wttr.in">
    <link rel="stylesheet" href="assets/css/theme.css">
  </head>
  <body class="directory-page">
    <header class="site-header">
      <a class="site-name" href="/" aria-label="blackblues home">blackblues</a>
      <div class="header-tools">
        <div class="clock-widget" aria-label="当前时间">
          <span id="clockTime" class="clock-time">--:--</span>
          <span id="clockWeekday" class="clock-weekday">星期--</span>
          <span id="weatherInfo" class="weather-info">天气 --</span>
        </div>
        <label class="search">
          <span class="search-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m16.5 16.5 4 4"></path>
            </svg>
          </span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="搜索" aria-label="搜索网站">
          <span id="searchCount" class="search-count" aria-live="polite">0 / 0</span>
        </label>
        <button id="theme-btn" class="theme-toggle" type="button" aria-label="切换主题">☀️</button>
      </div>
    </header>

    <main id="home" class="page-shell">
      <section class="web-search-area" aria-label="网页搜索">
        <form id="webSearchForm" class="web-search-form" role="search">
          <span class="web-search-icon" aria-hidden="true">🔍</span>
          <input id="webSearchInput" class="web-search-input" type="search" autocomplete="off" placeholder="搜索网页" aria-label="搜索网页">
          <span class="web-search-engines" aria-label="搜索引擎">
            <button class="web-search-engine is-active" type="button" data-engine="google" aria-pressed="true" aria-label="使用谷歌搜索">G</button>
            <button class="web-search-engine" type="button" data-engine="bing" aria-pressed="false" aria-label="使用必应搜索">B</button>
          </span>
        </form>
      </section>
      <section id="bookmarks" aria-label="网站书签">
        <div id="categoryList" class="category-list" aria-live="polite"></div>
      </section>
      <p id="emptyState" class="empty-state" hidden>没有找到相关网站</p>
    </main>

    <footer id="about" class="site-footer">
      <span>© 2026 blackblues · blackblues.xyz · 意见反馈：<a href="mailto:feedback@blackblues.xyz">feedback@blackblues.xyz</a></span>
      <span class="site-footer-links">
        <a href="/blog/">博客</a> ·
        <a href="/music/">音乐</a> ·
        <a href="https://github.com/blackblues360" target="_blank" rel="noopener noreferrer">GitHub</a>
      </span>
    </footer>
    <script>
      (() => {
        const form = document.querySelector('#webSearchForm');
        const input = document.querySelector('#webSearchInput');
        const bookmarkSearchInput = document.querySelector('#searchInput');
        const engineButtons = Array.from(document.querySelectorAll('.web-search-engine'));
        const storageKey = 'webSearchEngine';
        const searchUrls = {
          google: 'https://www.google.com/search?q=',
          bing: 'https://www.bing.com/search?q='
        };
        const readStorage = key => {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        };
        const writeStorage = (key, value) => {
          try {
            localStorage.setItem(key, value);
          } catch {
            // 搜索本身不依赖本地存储，保存失败时只影响下次默认引擎。
          }
        };

        if (!form || !input || engineButtons.length === 0) return;

        let currentEngine = readStorage(storageKey) === 'bing' ? 'bing' : 'google';

        const isTextInput = element =>
          element instanceof HTMLInputElement ||
          element instanceof HTMLTextAreaElement ||
          element instanceof HTMLSelectElement ||
          element.isContentEditable;

        const syncEngineButtons = () => {
          engineButtons.forEach(button => {
            const isActive = button.dataset.engine === currentEngine;
            button.classList.toggle('is-active', isActive);
            button.setAttribute('aria-pressed', String(isActive));
          });
        };

        engineButtons.forEach(button => {
          button.addEventListener('click', () => {
            const engine = button.dataset.engine;
            if (!searchUrls[engine]) return;

            currentEngine = engine;
            writeStorage(storageKey, currentEngine);
            syncEngineButtons();
            input.focus();
          });
        });

        form.addEventListener('submit', event => {
          event.preventDefault();

          const query = input.value.trim();
          if (!query) return;

          window.open(searchUrls[currentEngine] + encodeURIComponent(query), '_blank');
        });

        document.addEventListener('keydown', event => {
          if (event.ctrlKey || event.metaKey || event.altKey || isTextInput(document.activeElement)) return;

          if (event.key === '/') {
            event.preventDefault();
            input.focus();
            return;
          }

          if (event.key.toLowerCase() === 'f' && bookmarkSearchInput) {
            event.preventDefault();
            bookmarkSearchInput.focus();
          }
        });

        syncEngineButtons();
      })();
    </script>
    <script src="script.js"></script>
    <script src="assets/js/main.js" defer></script>
  </body>
</html>
