<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK BLUES</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
    color:white;
}

/* 背景模糊光斑 */

.blur{
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(120px);
    opacity:0.5;
}

.blur1{
    background:#3b82f6;
    top:-100px;
    left:-100px;
}

.blur2{
    background:#8b5cf6;
    bottom:-100px;
    right:-100px;
}

/* 主卡片 */

.card{
    position:relative;
    z-index:10;

    width:900px;
    max-width:90%;

    padding:60px;

    border-radius:32px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.12);

    box-shadow:
    0 8px 32px rgba(0,0,0,0.3);

    text-align:center;
}

/* 标题 */

h1{
    font-size:72px;
    font-weight:700;
    letter-spacing:-2px;
    margin-bottom:12px;
}

/* 副标题 */

.subtitle{
    color:rgba(255,255,255,0.7);
    font-size:20px;
    margin-bottom:50px;
}

/* 按钮 */

.links{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.links a{
    text-decoration:none;

    padding:14px 28px;

    border-radius:16px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.12);

    color:white;

    transition:0.3s ease;
}

.links a:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,0.15);
}

/* 底部 */

.footer{
    margin-top:50px;
    color:rgba(255,255,255,0.45);
    font-size:14px;
}

</style>
</head>

<body>

<div class="blur blur1"></div>
<div class="blur blur2"></div>

<div class="card">

    <h1>BLACK BLUES</h1>

    <div class="subtitle">
        AI · Linux · Cyber Space
    </div>

    <div class="links">
        <a href="https://github.com/" target="_blank">GitHub</a>

        <a href="https://chat.openai.com/" target="_blank">AI</a>

        <a href="https://linux.do/" target="_blank">Linux</a>

        <a href="https://v2ex.com/" target="_blank">V2EX</a>
    </div>

    <div class="footer">
        blackblues.xyz
    </div>

</div>

</body>
</html>
