    <h1 class="post-title">写在建站之前</h1>
    <p class="post-lede">为什么想要一个自己的网站？不是为了流量，不是为了影响力，只是想有个地方安静地说话。</p>
    <div class="post-content">
      <p>社交平台很方便，但也很吵。每一次表达都像是被放进一个流速很快的河里，很快就被新的内容推走。</p>
      <p>我想要一个慢一点的地方。这里不需要算法推荐，也不需要追热点。文章可以短，更新可以慢，重要的是它属于我自己。</p>
      <p>建站之前我给它定了一个很小的目标：能写，能放，能长期回来。其他东西都可以慢慢长出来。</p>
    </div>
