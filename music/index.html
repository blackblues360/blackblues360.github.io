<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Music | blackblues</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Noto+Sans+SC:wght@400;500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="./style.css?v=20260609-tags">
  </head>
  <body>
    <aside class="sidebar" aria-label="音乐页面导航">
      <a class="site-logo" href="../index.html" aria-label="返回 blackblues 首页">
        <span class="logo-mark">bb</span>
        <span class="logo-text">blackblues</span>
      </a>
      <nav class="side-nav" aria-label="主导航">
        <a class="is-active" href="#tracks">全部曲目</a>
        <a href="#tags">按标签</a>
        <a href="#playlist">网易云歌单</a>
        <a href="#about">关于</a>
      </nav>
      <section class="side-filter" aria-labelledby="sideTagsTitle">
        <h2 id="sideTagsTitle">标签</h2>
        <div id="sidebarTagList" class="sidebar-tag-list">
          <button class="sidebar-tag-button" type="button" data-filter-tag="流行" aria-pressed="false">流行</button>
          <button class="sidebar-tag-button" type="button" data-filter-tag="摇滚" aria-pressed="false">摇滚</button>
          <button class="sidebar-tag-button" type="button" data-filter-tag="民谣" aria-pressed="false">民谣</button>
          <button class="sidebar-tag-button" type="button" data-filter-tag="电子" aria-pressed="false">电子</button>
          <button class="sidebar-tag-button" type="button" data-filter-tag="嘻哈" aria-pressed="false">嘻哈</button>
          <button class="sidebar-tag-button" type="button" data-filter-tag="爵士" aria-pressed="false">爵士</button>
          <button class="sidebar-tag-button" type="button" data-filter-tag="古典" aria-pressed="false">古典</button>
          <button class="sidebar-tag-button" type="button" data-filter-tag="R&B" aria-pressed="false">R&amp;B</button>
          <button class="sidebar-tag-button" type="button" data-filter-tag="世界音乐" aria-pressed="false">世界音乐</button>
          <button class="sidebar-tag-button" type="button" data-filter-tag="轻音乐" aria-pressed="false">轻音乐</button>
          <button class="sidebar-tag-button" type="button" data-filter-tag="影视原声" aria-pressed="false">影视原声</button>
          <button class="sidebar-tag-button" type="button" data-filter-tag="游戏音乐" aria-pressed="false">游戏音乐</button>
          <button class="sidebar-tag-button" type="button" data-filter-tag="国风" aria-pressed="false">国风</button>
          <button class="sidebar-tag-button" type="button" data-filter-tag="儿童" aria-pressed="false">儿童</button>
        </div>
      </section>
    </aside>

    <main class="music-main">
      <div class="player-support" aria-hidden="true">
        <div id="cover-disc" class="album-cover"></div>
        <div id="lyricsPanel" class="lyrics-panel" aria-live="polite" hidden>
          <div id="lyricsList" class="lyrics-list"></div>
        </div>
      </div>

      <h1 class="visually-hidden">blackblues music</h1>
      <section id="tracks" class="track-section" aria-label="全部曲目">
        <label class="search-field" for="trackSearch">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input id="trackSearch" type="search" autocomplete="off" placeholder="搜索曲目、艺术家、专辑">
          <span id="trackCount">0 tracks</span>
        </label>
        <ol id="trackList" class="track-list" aria-live="polite"></ol>
      </section>

      <section id="tags" class="tag-section" aria-labelledby="tags-title">
        <h2 id="tags-title">按标签</h2>
        <div id="tagList" class="tag-list" aria-label="音乐标签"></div>
      </section>


      <section id="playlist" class="playlist-section" aria-labelledby="playlist-title">
        <h2 id="playlist-title">
          网易云歌单
          <a class="playlist-link" href="https://music.163.com/#/playlist?id=7523047921" target="_blank" rel="noopener noreferrer">
            <i class="ti ti-external-link" aria-hidden="true"></i>
            打开完整歌单
          </a>
        </h2>
        <p class="playlist-desc">我喜欢的音乐 · 实时更新 · 播放器仅展示前 10 首</p>
        <div class="playlist-embed">
          <iframe frameborder="no" border="0" marginwidth="0" marginheight="0"
            width="100%" height="340"
            src="https://music.163.com/outchain/player?type=0&id=7523047921&auto=0&height=320&theme=0"
            title="网易云音乐歌单 - 易拔苍龙角喜欢的音乐"
            loading="lazy">
          </iframe>
        </div>
      </section>

      <section id="about" class="about-section" aria-labelledby="about-title">
        <h2 id="about-title">关于</h2>
        <p>这里将用于收集个人歌单、练习片段和一些适合写作时循环播放的声音。</p>
      </section>
    </main>

    <nav class="mobile-tabs" aria-label="移动端导航">
      <a class="is-active" href="#tracks">曲目</a>
      <a href="#playlist">歌单</a>
      <a href="#tags">标签</a>
      <a href="#about">关于</a>
    </nav>

    <footer class="player-bar" aria-label="播放器控制栏">
      <div class="now-playing">
        <div id="nowCover" class="thumb-cover" aria-hidden="true"></div>
        <div class="now-meta">
          <span id="nowTitle" class="now-title">未选择曲目</span>
          <span id="nowArtist" class="now-artist">blackblues</span>
        </div>
      </div>
      <div class="transport">
        <div class="controls" aria-label="播放控制">
          <button id="prevButton" type="button" aria-label="上一首">
            <i class="ti ti-player-skip-back" aria-hidden="true"></i>
          </button>
          <button id="playButton" class="play-button" type="button" aria-label="播放">
            <i id="playIcon" class="ti ti-player-play" aria-hidden="true"></i>
          </button>
          <button id="nextButton" type="button" aria-label="下一首">
            <i class="ti ti-player-skip-forward" aria-hidden="true"></i>
          </button>
          <button id="modeButton" type="button" aria-label="顺序播放" title="顺序播放">
            <i id="modeIcon" class="ti ti-arrow-right" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <div class="volume">
        <i class="ti ti-volume" aria-hidden="true"></i>
        <input id="volumeSlider" class="volume-slider" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="音量">
      </div>
      <div class="progress-wrap">
        <span id="currentTime">00:00</span>
        <div id="progressBar" class="progress" aria-label="播放进度" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <span id="progressFill" style="width: 0%"></span>
        </div>
        <span id="durationTime">--:--</span>
      </div>
    </footer>

    <section id="mobilePlayerSheet" class="mobile-player-sheet" aria-hidden="true">
      <div class="mobile-sheet-grip" aria-hidden="true"></div>
      <button id="sheetCloseButton" class="sheet-close-button" type="button" aria-label="关闭播放器">
        <i class="ti ti-chevron-down" aria-hidden="true"></i>
      </button>
      <div class="sheet-artwork">
        <div id="sheetCover" class="album-cover sheet-cover" aria-hidden="true">
          <span class="album-ring"></span>
          <span class="album-hole"></span>
        </div>
      </div>
      <div class="sheet-meta">
        <span id="sheetTitle" class="sheet-title">未选择曲目</span>
        <span id="sheetArtist" class="sheet-artist">blackblues</span>
      </div>
      <div id="sheetLyricsPanel" class="lyrics-panel sheet-lyrics" aria-live="polite" hidden>
        <div id="sheetLyricsList" class="lyrics-list"></div>
      </div>
      <div class="sheet-controls" aria-label="完整播放控制">
        <button id="sheetPrevButton" type="button" aria-label="上一首">
          <i class="ti ti-player-skip-back" aria-hidden="true"></i>
        </button>
        <button id="sheetPlayButton" class="play-button" type="button" aria-label="播放">
          <i id="sheetPlayIcon" class="ti ti-player-play" aria-hidden="true"></i>
        </button>
        <button id="sheetNextButton" type="button" aria-label="下一首">
          <i class="ti ti-player-skip-forward" aria-hidden="true"></i>
        </button>
        <button id="sheetModeButton" type="button" aria-label="顺序播放" title="顺序播放">
          <i id="sheetModeIcon" class="ti ti-arrow-right" aria-hidden="true"></i>
        </button>
      </div>
      <div class="sheet-progress-wrap">
        <span id="sheetCurrentTime">00:00</span>
        <div id="sheetProgressBar" class="progress" aria-label="播放进度" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <span id="sheetProgressFill" style="width: 0%"></span>
        </div>
        <span id="sheetDurationTime">--:--</span>
      </div>
    </section>

    <audio id="audioPlayer" preload="metadata"></audio>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <script src="./player.js?v=20260609-tags"></script>
  </body>
</html>
